# Rota Pusulası'nı derleyip GitHub Pages'e yayınlar.
# Pull request'lerde sadece test + derleme çalışır; main'e gelen her push'ta site güncellenir.
name: Derle ve yayınla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Yol verisini haftada bir tazele (Pazartesi 03:17 UTC)
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek bir yayın; yenisi gelirse devam eden yayın iptal edilmez, sıraya girer.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Test (gerçek O-7 verisiyle kesim noktaları)
        run: npm test

      - name: Yol verisini önceden hazırla (Overpass → public/data/prebuilt.json)
        if: github.event_name != 'pull_request'
        run: npm run prefetch

      - name: Derle (tip kontrolü + tek dosya index.html)
        run: npm run build
        env:
          # İsteğe bağlı: repo secret'ı ORS_KEY tanımlıysa anahtar siteye gömülür
          VITE_ORS_KEY: ${{ secrets.ORS_KEY }}

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5
